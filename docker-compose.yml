name: vulnhub

# Shared with the wordpress, wpcli and cron services alike -- wp-cli and the
# cron loop both bootstrap the same plugins (encrypted secrets, Redis object
# cache, dynamic host) and silently ran without any of it for a while: no
# service but `wordpress` had this block, so `wp eval`/`wp cron event run`
# always saw an undefined VULNHUB_ENCRYPTION_KEY, fell back to a DB-stored
# key, and could never decrypt a secret encrypted through the web process.
x-wordpress-config-extra: &wp_config_extra |
  /* --- VulnHub runtime configuration --- */
  define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
  define( 'WP_DEBUG_DISPLAY', false );
  @ini_set( 'display_errors', 0 );
  define( 'SCRIPT_DEBUG', true );

  /* Behind the Cloudflare tunnel / reverse proxy */
  if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
      $$_SERVER['HTTPS'] = 'on';
  }
  if ( isset( $$_SERVER['HTTP_CF_CONNECTING_IP'] ) ) {
      $$_SERVER['REMOTE_ADDR'] = $$_SERVER['HTTP_CF_CONNECTING_IP'];
  } elseif ( isset( $$_SERVER['HTTP_X_FORWARDED_FOR'] ) ) {
      $$_SERVER['REMOTE_ADDR'] = trim( explode( ',', $$_SERVER['HTTP_X_FORWARDED_FOR'] )[0] );
  }

  /* Dynamic host: derive WP_HOME/WP_SITEURL from the request host, so the same
     image serves localhost in dev and whatever domain fronts it in production. */
  if ( ! empty( $$_SERVER['HTTP_HOST'] ) ) {
      $$vh_scheme = ( isset( $$_SERVER['HTTPS'] ) && 'on' === $$_SERVER['HTTPS'] ) ? 'https' : 'http';
      $$vh_host   = preg_replace( '/[^a-zA-Z0-9\\.\\-:]/', '', $$_SERVER['HTTP_HOST'] );
      define( 'WP_HOME',    $$vh_scheme . '://' . $$vh_host );
      define( 'WP_SITEURL', $$vh_scheme . '://' . $$vh_host );
  }

  /* Secret at rest for connector credentials (sodium secretbox) */
  define( 'VULNHUB_ENCRYPTION_KEY', '${VH_ENC_KEY}' );

  /* Redis object cache */
  define( 'WP_REDIS_HOST', 'redis' );
  define( 'WP_REDIS_PORT', 6379 );

  define( 'DISALLOW_FILE_EDIT', true );
  define( 'WP_MEMORY_LIMIT', '512M' );
  define( 'WP_MAX_MEMORY_LIMIT', '768M' );
  define( 'DISABLE_WP_CRON', true );
  define( 'AUTOMATIC_UPDATER_DISABLED', false );

services:
  db:
    image: mariadb:11
    container_name: vulnhub-db
    # 3g, not 1g. The findings table alone is 491MB and the whole database is
    # 540MB; at 1g the server could not hold its own working set and mariadbd
    # was measured with 55MB paged out to swap. Tuning is in conf/mysql.
    mem_limit: 3g
    memswap_limit: 3g
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=64M
    environment:
      MARIADB_DATABASE: vulnhub
      MARIADB_USER: vulnhub
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - ./db:/var/lib/mysql
      - ./conf/mysql/vulnhub.cnf:/etc/mysql/conf.d/vulnhub.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [vulnhub]

  redis:
    image: redis:7-alpine
    container_name: vulnhub-redis
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    # maxmemory + an eviction policy, not the defaults. Out of the box redis
    # runs maxmemory 0 with noeviction, so inside this 512m container a cache
    # that grows past the limit gets the process OOM-killed rather than
    # dropping a key -- and the widget cache is meant to grow.
    command: redis-server --save 60 1 --loglevel warning --maxmemory 384mb --maxmemory-policy allkeys-lru
    networks: [vulnhub]

  wordpress:
    build:
      context: ./docker/wp-redis
      args:
        BASE_IMAGE: wordpress:php8.3-apache
    container_name: vulnhub-wp
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8093:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: vulnhub
      WORDPRESS_DB_USER: vulnhub
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_TABLE_PREFIX: vh_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    volumes:
      - ./wp:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/zz-vulnhub.ini:ro
      # Prefork sizing. See the file for why the stock defaults were wrong in
      # both directions at once.
      - ./conf/apache/vulnhub-mpm.conf:/etc/apache2/conf-enabled/zz-vulnhub-mpm.conf:ro
    networks: [vulnhub]

  wpcli:
    build:
      context: ./docker/wp-redis
      args:
        BASE_IMAGE: wordpress:cli-php8.3
    container_name: vulnhub-wpcli
    # 4g, not 2g: a live Tenable sync on a real account processed 255k+
    # findings across 12k+ vulnerability definitions in one unbounded
    # synchronous PHP process and was OOM-killed by the container's own
    # cgroup at 2g (PHP CLI's own memory_limit is unbounded by default, so
    # it grows until the container's hard ceiling kills it, not a graceful
    # PHP fatal). The real fix is batching the sync so memory stays bounded
    # regardless of account size; this buys headroom for the account's
    # current scale in the meantime.
    mem_limit: 4g
    memswap_limit: 4g
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    # init: tini as PID 1. A bare `tail -f` as PID 1 gets no default
    # SIGTERM handler, so `docker stop` waited out the full 10s and SIGKILLed
    # it -- and WSL's own poweroff deadline is also 10s, so every clean WSL
    # shutdown ran out of time and was cut off with the stack still stopping.
    init: true
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: vulnhub
      WORDPRESS_DB_USER: vulnhub
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_TABLE_PREFIX: vh_
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    volumes:
      - ./wp:/var/www/html
    networks: [vulnhub]

  cron:
    build:
      context: ./docker/wp-redis
      args:
        BASE_IMAGE: wordpress:cli-php8.3
    container_name: vulnhub-cron
    # See wpcli's identical note: scheduled syncs run through this container.
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    user: "33:33"
    # flock -n: single-flight. A staged sync runs inline inside one
    # `wp cron event run` and can last many minutes; without the lock the 60s
    # loop starts a fresh overlapping run every tick, stacking multi-hundred-MB
    # PHP workers into this container until the OOM killer takes one -- which is
    # what killed the sync at the download->process boundary. -n means "skip
    # this tick if a run is still going", so runs never overlap.
    #
    # tail -n 20, not `head -20`: head closes the pipe after 20 lines, and the
    # next line the worker writes gets SIGPIPE -- a long run that emits >20
    # lines was being killed mid-flight. tail drains the whole stream first.
    # init: tini as PID 1. A bare `sh -c loop` as PID 1 gets no default
    # SIGTERM handler, so `docker stop` waited out the full 10s and SIGKILLed
    # it -- and WSL's own poweroff deadline is also 10s, so every clean WSL
    # shutdown ran out of time and was cut off with the stack still stopping.
    init: true
    entrypoint: >
      sh -c "while true; do
        flock -n /tmp/vh-cron.lock wp cron event run --due-now --path=/var/www/html --quiet 2>&1 | tail -n 20;
        sleep 60;
      done"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: vulnhub
      WORDPRESS_DB_USER: vulnhub
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_TABLE_PREFIX: vh_
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    volumes:
      - ./wp:/var/www/html
    networks: [vulnhub]

  mailhog:
    image: mailhog/mailhog
    container_name: vulnhub-mailhog
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    ports:
      - "8094:8025"
    networks: [vulnhub]

networks:
  vulnhub:
    name: vulnhub

