# VulnHub Apache tuning
#
# Measured 2026-09-10. The container was running Debian's stock prefork
# defaults, which are wrong here in both directions at once:
#
#   StartServers          5
#   MinSpareServers       5
#   MaxSpareServers      10
#   MaxRequestWorkers   150
#
# Too few, then too many. Idle workers get reaped down to ten, so a burst of
# traffic queues behind ten processes while Apache forks more -- and with
# mod_php each fork is a ~50MB PHP process, which is not fast. That is the
# shape behind a page that normally answers in 250ms taking sixteen seconds
# when several requests arrive together.
#
# At the other end, 150 workers at ~50MB is 7.5GB against a 2g container
# limit. That ceiling could never actually be reached; it would OOM first.
# The DB is also capped at 151 connections, and prefork opens one per worker.
#
# So: keep a real floor of warm workers, and set a ceiling the container can
# genuinely hold.

<IfModule mpm_prefork_module>
    StartServers            16
    MinSpareServers         12
    MaxSpareServers         28
    MaxRequestWorkers       40
    MaxConnectionsPerChild  2000
</IfModule>

# The portal is behind a Cloudflare tunnel, so every request arrives from the
# tunnel process on one connection. Keep-alive is worth having, but a long
# idle timeout just pins a prefork worker doing nothing.
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 3

