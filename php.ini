; VulnHub PHP tuning
;
; The two upload limits are per *request*, not per file. The importer slices a
; file in the browser and appends the slices server side, so these only need to
; be comfortably above one slice (32 MB at the largest) plus its multipart
; envelope -- 128 M gives four times the headroom. Raising them further would
; not raise the size of file the importer accepts, which is governed by
; VulnHub_Import_Storage::max_bytes() and by free disk.
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
default_socket_timeout = 60
date.timezone = Pacific/Auckland

; SMTP -> mailhog (for WP mail via PHP mail() fallback)
sendmail_path = "/usr/sbin/sendmail -t -i"

error_reporting = E_ALL
display_errors = Off
log_errors = On


; --- OPcache, sized 2026-09-10 ---
;
; Measured under the web SAPI: 71.6MB used, 28.5MB wasted, 27.9MB free of the
; stock 128MB, and 2,311 cached keys. Hit rate was already 99.98%, so this is
; not fixing a miss problem -- it is stopping the cache filling up and
; recycling, which throws away compiled code that then has to be recompiled on
; the next request. The wasted figure is what that recycling leaves behind.
;
; interned_strings_buffer is raised because WordPress plus Elementor plus
; sixteen plugins is a very large number of distinct strings, and the stock 8MB
; is a well-known ceiling for a site this shape.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 12000

; The portal is edited live on this box, so timestamps must keep being checked
; -- turning that off would mean a code change needs a container restart to
; show up. 2s is the stock revalidation window and is the right trade here.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
